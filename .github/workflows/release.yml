name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: novel-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: novel-linux-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact: novel-darwin-x64
          - os: macos-14
            target: bun-darwin-arm64
            artifact: novel-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Compile standalone binary
        run: bun build --compile --minify --target=${{ matrix.target }} ./bin/novel.ts --outfile dist/${{ matrix.artifact }}
      - name: Smoke test
        run: |
          ./dist/${{ matrix.artifact }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          for f in novel-*; do [ -f "$f" ] && shasum -a 256 "$f" >> SHA256SUMS || true; done
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/novel-*
            dist/SHA256SUMS
          generate_release_notes: true
